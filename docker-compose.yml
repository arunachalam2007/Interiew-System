version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: interview_ace_db
    environment:
      POSTGRES_USER: interview_user
      POSTGRES_PASSWORD: interview_password
      POSTGRES_DB: interview_ace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_user -d interview_ace_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: interview_ace_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview_ace_backend
    environment:
      - PROJECT_NAME=InterviewAce AI
      - SECRET_KEY=supersecret_production_change_me_key_12345
      - DATABASE_URL=postgresql+asyncpg://interview_user:interview_password@postgres:5432/interview_ace_db
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_CORS_ORIGINS=["http://localhost","http://localhost:5173","http://localhost:80"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview_ace_celery
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      - SECRET_KEY=supersecret_production_change_me_key_12345
      - DATABASE_URL=postgresql+asyncpg://interview_user:interview_password@postgres:5432/interview_ace_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interview_ace_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
